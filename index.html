<style>
:root{--bg:#F4F5F6;--white:#fff;--ink:#23272B;--muted:#6E7681;--line:#E4E7EA;--teal:#04A29C;--teal-d:#037E79;

*{box-sizing:border-box;margin:0}body{background:var(--bg);font-family:var(--body);color:var(--ink);font-size:14px}
button{font-family:var(--body);cursor:pointer}input,select,textarea{font-family:var(--body);font-size:14px;color:var(--ink)}
.mono{font-family:var(--mono)}

#loader small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

#loader.hide{opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}

.uchip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}.uchip .dot{width:10px;height:10px;border-radius:3px}

.bell .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:2px 6px;font-family:var(--mono)}
.npanel{position:absolute;right:0;top:46px;width:340px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 18px 50px rgba(35,39,43,.25);overflow:hidden;display:none;z-index:60}
.npanel.open{display:block}.npanel header{padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}

.nitem{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.nitem:hover{background:#F6F8F8}.nitem.unread{background:#EDF7F6}

.btn{border-radius:9px;border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.danger{background:#FDEBEC;border-color:#F5C2C4;color:var(--red)}
.btn.ok{background:#E8F6EE;border-color:#BFE5CE;color:#157A43}.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}

main{max-width:1760px;margin:0 auto;padding:0 20px 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:20px}
.adminwrap{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;margin-top:16px}
.taskside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.tside-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px}

.trow2{border-top:1px solid var(--line);padding:7px 0}

.trayhead.alert{background:#7A2E31}.trayhead.muted{background:#4A5158}.trayhead.prod{background:#0E5E6F}.trayhead.sosp{background:#7A5C00}
.headtools{margin-left:auto;display:flex;gap:12px;align-items:center}
.switchlabel{font-size:11px;color:#C9CED4;display:flex;gap:6px;align-items:center;cursor:pointer}
.traybody{padding:8px;min-height:44px;max-height:46vh;overflow:auto}
.traybody.tall{max-height:64vh}
.traybody.dz.over,.tablewrap.dz.over{background:#EDF7F6;outline:2px dashed var(--teal);outline-offset:-6px}
.tablewrap{overflow:auto;max-height:64vh}
.ptable{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ptable th{background:#F6F7F8;text-align:left;padding:5px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);position:sticky;top:0;white-space:nowrap;overflow:hidden}
.ptable td{padding:4px 8px;border-top:1px solid var(--line);vertical-align:middle;overflow:hidden}
.ptable tbody tr{cursor:grab;background:#fff}.ptable tbody tr:hover{background:#F6F8F8}.ptable tbody tr.dragging{opacity:.45}
.ptable tbody tr.ro{cursor:default}
.ptable tbody tr.grayrow{opacity:.6}
.ptable tbody tr.warnrow{background:#FFF9EC;box-shadow:inset 0 0 0 1px var(--amber)}
td.nowrap{white-space:nowrap}
.clicell{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.stcell{white-space:nowrap}.stdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.mutedcell{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.late{color:var(--red);font-weight:700}
td.ic{white-space:nowrap}
.star{color:var(--giallo)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.lane{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.lanehead{padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.lanehead .dot{width:12px;height:12px;border-radius:4px;flex:none}.lanehead b{font-family:var(--disp);font-size:13.5px}
.lanehead .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.lanebody{max-height:60vh;overflow:auto}
.lanebody.dz.over{background:#EDF7F6;outline:2px dashed var(--teal);outline-offset:-6px}
.lanebody .ptable th{position:static}
.info{border:0;background:0;color:#9AA0A6;font-size:13px;font-weight:600;border-radius:50%;width:22px;height:22px;line-height:1;opacity:.8}
.info:hover{opacity:1;color:var(--teal)}
.chip{border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:600;background:#F0F2F3;color:#4A5158;white-space:nowrap}
.chip.st{color:#fff}.chip.sett{text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.flags{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.flag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 7px;display:inline-block;white-space:nowrap}
.flag.tempo{background:#FDEBEC;color:var(--red)}.flag.rif{background:#FFF4E5;color:#B36B00}
.flag.check{background:#FFF4E5;color:var(--amber)}.flag.ann{background:#EEF0F2;color:#6E7681}
.flag.rientro{background:#E8F1FB;color:#1D4ED8}
.empty{color:var(--gray);font-size:12px;text-align:center;padding:12px 6px;border:1.5px dashed var(--line);border-radius:9px}
.opwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;margin-top:16px}
.queue{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:14px;margin-bottom:14px}
.queue h3{font-family:var(--disp);font-size:14px;margin-bottom:10px}
.qrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.qrow:first-of-type{border-top:0}
.side{display:flex;flex-direction:column;gap:14px}
.spanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.spanel h3{font-family:var(--disp);font-size:13px;margin-bottom:10px}
.cd{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--teal);background:#EDF7F6;border-radius:99px;padding:3px 9px;white-space:nowrap}
.cd.low{color:var(--red);background:#FDEBEC}
.titem{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.titem:first-of-type{border-top:0}.titem .st-dot{width:9px;height:9px;border-radius:3px;margin-top:4px;flex:none;background:var(--gray)}
.titem.completata .st-dot{background:var(--verde)}.titem.non_completata .st-dot{background:var(--red)}
.titem)}
.titem.completata .st-dot{background:var(--verde)}.titem.non_completata .st-dot{background:var(--red)}
.titem small{color:var(--muted);display:block}.titem .mot{color:var(--red);font-size:11px}
.mini{border:0;background:0;color:var(--muted);font-size:11px;text-decoration:underline}
.addrow{display:flex;gap:6px;margin-top:8px}.addrow input,.addrow select{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;min-width:0}
.ophdr{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.ophdr h2{font-family:var(--disp);font-size:24px;display:flex;align-items:center;gap:10px}.ophdr .dot{width:14px;height:14px;border-radius:4px}
.badge-ro{background:#FFF4E5;color:#B36B00;border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.06em}
.board{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;margin-top:16px}
.overlay{position:fixed;inset:0;background:rgba(24,27,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(680px,100%);max-height:86vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{font-family:var(--disp);font-size:18px;margin-bottom:4px}.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.msec{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.msec>header{padding:9px 13px;font-weight:600;font-size:12.5px;background:#F6F7F8}
.msec>header.warn{background:#FFF9EC;color:#8a6100}
.mrow{display:flex;gap:10px;align-items:center;padding:9px 13px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.mrow label{flex:1;display:flex;gap:9px;align-items:center;cursor:pointer}.mrow .dest{font-size:11px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.mfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.formrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.formrow input,.formrow select,.formrow textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.formrow input{flex:1;min-width:120px}
.stars button{border:0;background:0;font-size:22px;color:#D8DCE0;cursor:pointer;padding:0 2px}
.stars button.on{color:var(--giallo)}
.logrow{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;display:flex;gap:10px}
.logrow time{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.detbox{background:#F6F7F8;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;white-space:pre-line;margin-top:8px}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:tin .25s;max-width:380px}
.toast.warn{background:#8a6100}.toast.ok{background:#157A43}.toast.err{background:#A32E32}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.statcard{border:1px solid var(--line);border-radius:12px;padding:16px;border-top:4px solid var(--c,var(--teal))}
.statcard .vals{display:flex;gap:22px;margin-top:10px}
.statcard .vals div span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.statcard .vals div b{font-family:var(--mono);font-size:26px}
@media(max-width:1100px){.adminwrap,.board,.opwrap{grid-template-columns:1fr}.lanes{grid-template-columns:1fr}.pick{grid-template-columns:1fr}}
</style>

<script>

 showAnn:localStorage.getItem('dg_showann')==='1',taskFilter:'open'};

 modifiche:{l:'Modifiche da fare',c:'#B49AF0'},da_produrre:{l:'Da produrre',c:'#6FC3F2'},completato:{l:'Completato',c:'#1FA45B'}};

 in_accettazione:'Accett.',verificato_ok:'Verificato',problema:'Problema',da_assegnare:'Smistare',annullato:'Annull.',sospeso:'Sospeso'};

const fmtD=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}):'—';

const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const monthStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(1);return x};

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();
 o.connect(g);g.connect(c.destination);o.frequency.value=880;
 g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.01);
 g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.6);o.start();o.stop(c.currentTime+.65)}catch(e){}}
async function mutate(id,patch,msg,type){

 applyLocal(id,patch);route();

  if(!data||!data.length){toast('Il database ha rifiutato la modifica (permessi)','err');if(prev)applyLocal(id,prev);route();return false}

 }catch(e){toast('Errore: '+e.message,'err');if(prev)applyLocal(id,prev);route();return false}}

function parseItaDate(s){if(!s)return null;const m=String(s).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
 if(!m)return null;return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
function matchGrafico(s){if(!s)return null;const u=String(s).toUpperCase();
 const o=operators().find(p=>u.includes(p.username.toUpperCase()));return o?o.id:null}
function buildDettagli(r){const d=[];
 if(r.preso_da)d.push('Preso da: '+r.preso_da);
 if(r.tot)d.push('Totale dovuto: '+r.tot);
 if(r.operatore)d.push('Operatore: '+r.operatore);
 if(r.agente)d.push('Agente: '+r.agente);
 if(r.acconto)d.push('Acconto: '+r.acconto);
 if(r.stato)d.push('Stato Danea: '+r.stato);
 return d.join('\n')}
function rowsFromFile(data){const out=[];let skipped=0;
 for(let i=1;i<data.length;i++){const r=data[i];if(!r||!r.length)continue;
  const c0=(r[0]||'').trim(),num=(r[3]||'').trim();
  if(c0==='-'||(r[1]||'').toLowerCase().startsWith('stato')){skipped++;continue}
  if(!num){skipped++;continue}
  out.push({numero:num,data:parseItaDate(r[1]),preso_da:(r[2]||'').trim(),stato:(r[4]||'').trim(),
   graficoRaw:(r[5]||'').trim(),consegna:parseItaDate(r[6]),cliente:(r[7]||'').trim(),commento:(r[8]||'').trim(),
   tot:(r[9]||'').trim(),settore:(r[10]||'').trim(),operatore:(r[11]||'').trim(),agente:(r[12]||'').trim(),
   acconto:((r[13]||'').trim()||(r[14]||'').trim())});}
 return{rows:out,skipped}}
function importStatus(r){
 const st=(r.stato||'').toLowerCase().trim();
 if(/annull|sospeso/.test(st))return 'annullato';
 if(/chiuso|completato|evaso|consegnato/.test(st))return 'completato';
 const graf=matchGrafico(r.graficoRaw);
 if(!graf)return 'da_assegnare';
 const c=(r.commento||'').toUpperCase();
 if(/DA PRODURRE|FILE PRONTO|PRONTO X STAMPA/.test(c))return 'da_produrre';
 if(/BOZZA INVIATA/.test(c))return 'bozza_inviata';
 if(/MODIFICHE/.test(c))return 'modifiche';
 return 'da_iniziare'}
function rowPayload(r){
 const st=importStatus(r),now=new Date().toISOString();
 return{numero:r.numero,cliente:r.cliente,data_ordine:r.data,consegna:r.consegna,consegna_ora:'18:00',
  tassativo:/TASSATIV/i.test(r.commento||''),
  commento:r.commento,settore:r.settore,dettagli:buildDettagli(r),status:st,grafico:matchGrafico(r.graficoRaw),
  accettato_at:['da_iniziare','bozza_inviata','modifiche','da_produrre','completato'].includes(st)?now:null,
  completato_at:st==='completato'?now:null}}

async function loadAll(){

/* ============ drag&drop ============ */
function bindDnD(){
 document.querySelectorAll('tr[draggable="true"]').forEach(c=>{
  c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging')});
  c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
 document.querySelectorAll('.dz').forEach(z=>{
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');handleDrop(z.dataset.drop,e.dataTransfer.getData('text/plain'))})})}
async function handleDrop(target,id){
 const o=S.orders.find(x=>x.id===id);if(!o)return;
 if(S.prof.role==='operator'){
  const col=target.split(':')[1];if(!STATI[col])return;
  if(col===o.status)return;
  if(col==='bozza_inviata'){askRevision(id,async()=>{await mutate(id,{status:col},'Bozza inviata')});return}
  if(col==='completato'){askSurvey(id);return}
  await mutate(id,{status:col},'Aggiornato')}
 else if(S.prof.role==='admin'){
  if(target==='pool'){await releaseOrder(id,{msg:'Rimesso in smistamento'})}
  else if(target.startsWith('lane:')){
   const g=target.split(':')[1];
   if(o.status==='da_assegnare'||o.status==='problema'){
    await mutate(id,{status:'in_accettazione',grafico:g,assegnato_at:new Date().toISOString(),scadenza_tempo:false,motivo_rifiuto:null},'Assegnato a '+opName(g))}
   else{await mutate(id,{grafico:g},'Assegnato a '+opName(g))}}}}

 ${o.dettagli?`<h3 style="margin-top:16px">Altri dettagli</h3><div class="detbox">${esc(o.dettagli)}</div>`:''}
 ${o.commento?`<h3 style="margin-top:16px">Commento</h3><div class="detbox">${esc(o.commento)}</div>`:''}
 <div class="mfoot"><button class="btn" onclick="closeModal()">Chiudi</button></div>`)}

/* ============ task ============ */
async function addTask(){
 const t=$('#tt').value.trim(),d=$('#td').value.trim(),g=$('#tg').value,sc=$('#ts').value||null;
 if(!t)return;
 await sb.from('tasks').insert({titolo:t,descrizione:d,grafico:g,creato_da:S.prof.id,privata:false,scadenza:sc});
 await loadAll();route();toast('Task assegnata','ok')}
async function taskDone(id,ok){
 if(ok){await sb.from('tasks').update({stato:'completata',chiuso_il:new Date().toISOString()}).eq('id',id);await loadAll();route();toast('Task completata','ok')}
 else{showModal(`<h3>Motivo mancato completamento</h3><textarea id="tm" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px"></textarea>
 <div class="mfoot"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn danger" onclick="confirmTaskNo('${id}')">Conferma</button></div>`);
 noAutocomplete()}}
async function confirmTaskNo(id){
 const m=$('#tm').value.trim();if(!m){toast('Indica il motivo','err');return}
 await sb.from('tasks').update({stato:'non_completata',motivo:m,chiuso_il:new Date().toISOString()}).eq('id',id);
 closeModal();await loadAll();route()}
function pickCol(c){window._col=c;document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===c))}
function taskEdit(id){
 const t=S.tasks.find(x=>x.id===id);
 const notes=S.notes.filter(n=>n.task_id===id);
 window._col=t.colore||'';
 showModal(`<h3>Task · ${esc(t.titolo)}</h3><p class="sub">Modifica veloce: descrizione, scadenza, colore post-it, allegato, appunti.</p>
 <div class="formrow"><input id="te-t" value="${esc(t.titolo)}"></div>
 <div class="formrow"><textarea id="te-d" rows="2" style="flex:1">${esc(t.descrizione||'')}</textarea></div>
 <div class="formrow"><select id="te-g">${operators().map(o=>`<option value="${o.id}" ${t.grafico===o.id?'selected':''}>${esc(o.display_name)}</option>`).join('')}</select>
 <input id="te-s" type="date" value="${t.scadenza||''}"></div>
 <div class="formrow"><div class="swatches" id="sw">${POSTIT.map(c=>`<button style="background:${c}" data-c="${c}" class="${(t.colore||'')===c?'on':''}" onclick="pickCol('${c}')"></button>`).join('')}
 <button style="background:#fff" data-c="" class="${!t.colore?'on':''}" onclick="pickCol('')" title="Nessun colore">∅</button></div></div>
 <div class="formrow">${t.allegato_url?`<a href="${t.allegato_url}" target="_blank"><img class="thumb" src="${t.allegato_url}"></a>`:''}
 <input type="file" id="te-f" accept="image/*" onchange="uploadAllegato('${id}',this.files[0])"></div>
 <div class="msec"><header>Appunti (${notes.length})</header>
 ${notes.map(n=>`<div class="mrow" style="cursor:default"><span><b>${esc(opName(n.autore))}</b> · ${esc(n.testo)} <span class="dest">${rel(n.creato_il)}</span></span></div>`).join('')||'<div class="mrow" style="cursor:default">Nessun appunto</div>'}
 <div class="mrow"><input id="note-in" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px" placeholder="Nuovo appunto…">
 <button class="btn sm" onclick="addNote('${id}')">+</button></div></div>
 <div class="mfoot"><button class="btn danger" onclick="delTask('${id}')">🗑 Elimina</button>
 <button class="btn" onclick="closeModal()">Chiudi</button>
 <button class="btn pri" onclick="saveTask('${id}')">Salva</button></div>`);
 noAutocomplete()}
async function saveTask(id){
 const{error}=await sb.from('tasks').update({titolo:$('#te-t').value.trim(),descrizione:$('#te-d').value.trim(),
  grafico:$('#te-g').value,scadenza:$('#te-s').value||null,colore:window._col||null}).eq('id',id);
 if(error){toast(error.message,'err');return}
 closeModal();await loadAll();route();toast('Task aggiornata','ok')}
async function delTask(id){
 if(!confirm('Eliminare definitivamente questa task?'))return;
 closeModal();await sb.from('tasks').delete().eq('id',id);await loadAll();route();toast('Task eliminata','ok')}
async function addNote(id){
 const v=$('#note-in').value.trim();if(!v)return;
 await sb.from('task_notes').insert({task_id:id,autore:S.prof.id,testo:v});
 await loadAll();taskEdit(id)}
async function uploadAllegato(id,file){
 if(!file)return;
 const path=Date.now()+'_'+file.name;
 const{error}=await sb.storage.from('task-allegati').upload(path,file,{upsert:true});
 if(error){toast('Allegato: '+error.message,'err');return}
 const{data}=await sb.storage.from('task-allegati').getPublicUrl(path);
 await sb.from('tasks').update({allegato_url:data.publicUrl}).eq('id',id);
 await loadAll();taskEdit(id);toast('Allegato caricato','ok')}
async function addPriv(){
 const v=$('#priv-in').value.trim();if(!v)return;
 await sb.from('tasks').insert({titolo:v,grafico:S.prof.id,creato_da:S.prof.id,privata:true});
 await loadAll();route()}
async function togglePriv(id){
 const t=S.tasks.find(x=>x.id===id);
 await sb.from('tasks').update({stato:t.stato==='aperta'?'completata':'aperta',chiuso_il:t.stato==='aperta'?new Date().toISOString():null}).eq('id',id);
 await loadAll();route()}

/* ============ import CSV ============ */
let IMPORT=null;
function handleFile(file){if(!file)return;Papa.parse(file,{skipEmptyLines:true,complete:r=>prepareImport(r.data)})}
async function prepareImport(data){
 const{rows,skipped}=rowsFromFile(data);
 await loadAll();
 const existing=new Map(S.orders.map(o=>[o.numero+'|'+(o.data_ordine||''),o]));
 const nuovi=[],gia=[],danea=[],ann=[];
 for(const r of rows){
  const key=r.numero+'|'+(r.data||'');const ex=existing.get(key);
  const st=importStatus(r);const graf=matchGrafico(r.graficoRaw);
  const dest=st==='annullato'?'Annullato':(graf?'In lavorazione a '+opName(graf):'Da assegnare');
  if(!ex){(st==='annullato'?ann:nuovi).push(Object.assign({},r,{grafico:graf,st:st,dest:dest}))}
  else{if(ex.status==='completato'||ex.status==='verificato_ok')danea.push(Object.assign({},r,{ex:ex}));
   gia.push(Object.assign({},r,{ex:ex,choice:'skip'}))}}
 IMPORT={nuovi:nuovi,gia:gia,danea:danea,ann:ann,skipped:skipped};
 showImportModal()}
function showImportModal(){
 const nuovi=IMPORT.nuovi,gia=IMPORT.gia,danea=IMPORT.danea,ann=IMPORT.ann,skipped=IMPORT.skipped;
 const secN=nuovi.length?`<div class="msec"><header>① Nuovi lavori da aggiungere (${nuovi.length})</header>
 ${nuovi.map((r,i)=>`<div class="mrow" style="cursor:default"><label><input type="checkbox" checked data-nuovo="${i}">
 <span>#${esc(r.numero)} · ${esc(r.cliente)}${/TASSATIV/i.test(r.commento||'')?' <span class="star">★</span>':''}<br><span class="dest">→ ${esc(r.dest)}</span></span></label></div>`).join('')}</div>`:'';
 const secA=ann.length?`<div class="msec"><header>② Ordini annullati in Danea (${ann.length}) — importati come Annullato</header>
 ${ann.map((r,i)=>`<div class="mrow" style="cursor:default"><label><input type="checkbox" checked data-ann="${i}">
 <span>#${esc(r.numero)} · ${esc(r.cliente)}</span></label><span class="dest">→ Annullato</span></div>`).join('')}</div>`:'';
 const secG=gia.length?`<div class="msec"><header>③ Già esistenti (${gia.length})</header>
 ${gia.map((r,i)=>`<div class="mrow" style="cursor:default"><span>#${esc(r.numero)} · ${esc(r.cliente)}</span>
 <span class="seg"><button data-gia="${i}" data-c="skip" class="on">Ignora</button><button data-gia="${i}" data-c="overwrite">Sovrascrivi</button></span></div>`).join('')}</div>`:'';
 const secD=danea.length?`<div class="msec"><header class="warn">⚠ Verifica Danea (${danea.length})</header>
 ${danea.map(r=>`<div class="mrow" style="cursor:default"><span>#${esc(r.numero)} · ${esc(r.cliente)}<br><span class="dest">In dashboard è <b>completato</b>, nel file risulta ancora attivo. Verifica e correggi Danea.</span></span></div>`).join('')}</div>`:'';
 showModal(`<h3>Anteprima importazione</h3><p class="sub">Controlla prima di scrivere nel database. ${skipped?'Ignorate '+skipped+' righe tecniche.':''}</p>
 ${secN}${secA}${secG}${secD}
 <div class="mfoot"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn pri" onclick="confirmImport()">Conferma importazione</button></div>`)}
async function confirmImport(){
 const selN=[...document.querySelectorAll('[data-nuovo]:checked')].map(x=>+x.dataset.nuovo);
 const selA=[...document.querySelectorAll('[data-ann]:checked')].map(x=>+x.dataset.ann);
 const rows=selN.map(i=>IMPORT.nuovi[i]).concat(selA.map(i=>IMPORT.ann[i]));
 let added=0,over=0;
 for(const r of rows){
  const{error}=await sb.from('orders').insert(rowPayload(r));
  if(error)toast('#'+r.numero+' — '+error.message,'err');else added++}
 for(const r of IMPORT.gia){
  if(r.choice!=='overwrite')continue;
  const{error}=await sb.from('orders').update({cliente:r.cliente,consegna:r.consegna,commento:r.commento,settore:r.settore,dettagli:buildDettagli(r),tassativo:/TASSATIV/i.test(r.commento||'')}).eq('id',r.ex.id);
  if(!error)over++}
 await sb.from('meta').upsert({chiave:'ultimo_import',valore:new Date().toISOString(),aggiornato_il:new Date().toISOString()});
 closeModal();await loadAll();route();
 toast('Import completato: '+added+' caricati · '+over+' sovrascritti','ok')}

/* ============ countdown ============ */
let cdTimer=null;
function tickCountdowns(){
 clearTimeout(cdTimer);
 document.querySelectorAll('.cd').forEach(el=>{
  const dl=new Date(el.dataset.deadline).getTime()+ACC_MIN*60000;
  const left=dl-Date.now();
  if(left<=0){el.textContent='scaduto';el.classList.add('low');return}
  const m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.classList.toggle('low',left<10*60000)});
 cdTimer=setTimeout(tickCountdowns,1000)}

/* ============ PDF / statistiche ============ */
function statsPayload(){
 const ws=monday(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
 const ms=monthStart(new Date()),me=new Date(ms);me.setMonth(me.getMonth()+1);
 return{mese:ms.toISOString().slice(0,7),
  stats:operators().map(o=>({nome:o.display_name,settimana:countFor(o.id,ws,we),mese:countFor(o.id,ms,me)})),
  ordini:S.orders.filter(o=>o.completato_at&&new Date(o.completato_at)>=ms&&new Date(o.completato_at)<me)
   .map(o=>({numero:o.numero,cliente:o.cliente,grafico:opName(o.grafico),completato:fmtDT(o.completato_at)}))}}
function pdfCompletatiMese(){
 const ms=monthStart(new Date()),me=new Date(ms);me.setMonth(me.getMonth()+1);
 const list=S.orders.filter(o=>o.completato_at&&new Date(o.completato_at)>=ms&&new Date(o.completato_at)<me);
 if(!list.length){toast('Nessun completato questo mese','warn');return}
 const doc=new window.jspdf.jsPDF();
 doc.setFontSize(16);doc.text('Dashboard Grafica · Completati del mese',14,16);
 doc.autoTable({startY:24,head:[['N.','Cliente','Grafico','Completato']],body:list.map(o=>[o.numero,o.cliente,opName(o.grafico),fmtDT(o.completato_at)])});
 doc.save('completati-mese.pdf');toast('PDF generato','ok')}

boot().catch(e=>{hideLoader();document.getElementById('app').innerHTML='<div style="padding:40px;font-family:var(--mono);color:#A32E32">Errore avvio: '+e.message+'</div>';});
